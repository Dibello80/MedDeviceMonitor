name: MedDeviceMonitor CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "simulator/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: simulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Flask application
        working-directory: simulator
        run: |
          python -m py_compile app.py
          python -c "from app import app; print('Flask application imported successfully')"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c77da5912a6b7f75" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ssm-user/MedDeviceMonitor",
              "git fetch origin",
              "git reset --hard origin/master",
              "cd simulator",
              "source venv/bin/activate",
              "pip install -r requirements.txt",
              "sudo systemctl restart meddevicemonitor",
              "sleep 5",
              "curl --fail http://127.0.0.1:5000/api/reading"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c77da5912a6b7f75"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c77da5912a6b7f75" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c77da5912a6b7f75" \
            --query 'StandardOutputContent' \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0c77da5912a6b7f75" \
              --query 'StandardErrorContent' \
              --output text

            exit 1
          fi

      - name: Verify public deployment
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              https://med.dibellointeractive.com/api/reading; then
              echo
              echo "MedDeviceMonitor is healthy."
              exit 0
            fi

            echo "Attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Public application health check failed."
          exit 1